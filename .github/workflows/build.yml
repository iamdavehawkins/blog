name: Rebuild from Buttondown

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "posts/**"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html p posts.json feed.xml sitemap.xml robots.txt 404.html
          if git diff --cached --quiet; then
            echo "No new letters."
          else
            git commit -m "Rebuild from Buttondown ($(date -u +%Y-%m-%d))"
            git push
          fi
